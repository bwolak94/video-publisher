global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"

receivers:
  - name: "default"
    webhook_configs:
      - url: "${ALERT_WEBHOOK_URL:-http://localhost:3002/api/webhooks/alert}"
        send_resolved: true
